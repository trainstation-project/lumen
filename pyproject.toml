[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "lumen"
version = "0.1.0"
description = "A minimal tensor library prototype with a Rust core"
# Pinned to 3.12, the one version every backend is built and tested on.
requires-python = "==3.12.*"

[project.optional-dependencies]
# CUDA's fill_ is a CuTe DSL kernel (lumen/kernels/fill/cuda.py), imported
# with lumen on a machine with a CUDA device. The CuTe DSL ships only for
# Linux, so elsewhere the extra installs nothing.
cuda = [
    "nvidia-cutlass-dsl; sys_platform == 'linux'",
    "cuda-python; sys_platform == 'linux'",
    # Its compiled kernels are called from Rust through TVM-FFI's C ABI.
    "apache-tvm-ffi; sys_platform == 'linux'",
    "triton; sys_platform == 'linux'",
]
# A TPU's runtime: libtpu.so, which lumen/device/tpu loads at run time and
# which compiles lumen's kernels (`make test` points TPU_LIBRARY_PATH at
# this package's). Linux only. Pinned: 0.0.51's Mosaic aborts on lumen's
# kernels (infer_memref_layout check), and Python 3.10 tops out at 0.0.21,
# whose Mosaic is too old to read them; 0.0.48.1 needs Python 3.11+.
tpu = ["libtpu==0.0.48.1; sys_platform == 'linux'"]
# `make style`: the pre-commit hooks (.pre-commit-config.yaml).
dev = ["pre-commit"]
# `make test`: the Python tests' runner and reference values.
test = ["pytest", "pytest-xdist", "numpy"]

[tool.maturin]
# Mixed Rust/Python project in one folder: the crate, built with the
# `python` feature, is installed as the native submodule `lumen._native`,
# which registers each folder's bindings as `lumen.<folder>._C`; the Python
# files in ./lumen re-export them. The Rust and Objective-C++ sources
# that share the folder stay out of the wheel.
module-name = "lumen._native"
python-source = "."
features = ["python"]
exclude = ["lumen/**/*.rs", "lumen/**/*.mm"]

[tool.isort]
# Agree with black (.pre-commit-config.yaml), so the two hooks settle.
profile = "black"
line_length = 119

[tool.pyright]
# The `lumen.<folder>._C` modules are created at runtime by the native
# `lumen._native`, so only their `_C.pyi` stubs exist on disk.
reportMissingModuleSource = false

[tool.pytest.ini_options]
# Device test cases; see tests/device/test_tensor_devices.py and the Makefile.
markers = [
    "mps: needs an MPS (Metal) device",
    "cuda: needs a CUDA device and a wheel built with the `cuda` feature",
    "tpu: needs a TPU and a wheel built with the `tpu` feature",
    "all_devices: needs every device of its kind, not one worker's (make test runs these after the rest, serially)",
]
