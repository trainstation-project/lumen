[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "lumen"
version = "0.1.0"
description = "A minimal tensor library prototype with a Rust core"
requires-python = ">=3.9"

[project.optional-dependencies]
# CUDA's fill_ is a CuTe DSL kernel (lumen/ops/fill/cute_fill.py), imported
# with lumen on a machine with a CUDA device. The CuTe DSL ships only for
# Linux, so elsewhere the extra installs nothing.
cuda = [
    "nvidia-cutlass-dsl; sys_platform == 'linux'",
    "cuda-python; sys_platform == 'linux'",
]

[tool.maturin]
# Mixed Rust/Python project in one folder: the crate, built with the
# `python` feature, is installed as the native submodule `lumen._C`; the
# Python files in ./lumen re-export it. The Rust and Objective-C++ sources
# that share the folder stay out of the wheel.
module-name = "lumen._C"
python-source = "."
features = ["python"]
exclude = ["lumen/**/*.rs", "lumen/**/*.mm"]

[tool.pytest.ini_options]
# Device test cases; see tests/test_tensor_devices.py and the Makefile.
markers = [
    "mps: needs an MPS (Metal) device",
    "cuda: needs a CUDA device and a wheel built with the `cuda` feature",
]
