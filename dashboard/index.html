<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --fg: #16181d; --muted: #5d6573; --line: #dde1e7; --grid: #eceff3;
    --ok: #1f7a4d; --warn: #9a6400; --bad: #b4232c; --link: #1d5fb8;
    --s1: #2563c9; --s2: #c2581b; --s3: #7b8494; --s4: #8b3fc4; --roof: #16181d; --faint: #c9ced6;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --serif: Georgia, "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --hl-key: #a1287a; --hl-type: #1d6f8a; --hl-num: #9a5b00; --hl-com: #6a737d; --hl-attr: #6f42c1;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #111317; --panel: #191c21; --fg: #e9ebef; --muted: #9aa2b1; --line: #2c313a; --grid: #23272e;
    --ok: #5cc28f; --warn: #e2b04a; --bad: #f0727a; --link: #7fb0f5;
    --s1: #6fa3f7; --s2: #f08a4b; --s3: #8a93a3; --s4: #c08bf0; --roof: #e9ebef; --faint: #3a404b; color-scheme: dark;
    --hl-key: #f28bc6; --hl-type: #6cc7e0; --hl-num: #f0b46a; --hl-com: #8b949e; --hl-attr: #c4a5f5;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
  [hidden] { display: none !important; }
  a { color: var(--link); }
  .lx { display: flex; flex-direction: column; gap: 24px; max-width: 1280px; margin: 0 auto;
        padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .lx-head { display: flex; flex-direction: column; gap: 6px; }
  .lx-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .lx-theme { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; padding: 0; flex: 0 0 auto;
              border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); cursor: pointer; }
  .lx-theme:hover { border-color: var(--link); color: var(--link); }
  .lx-theme .icon-moon { display: none; }
  :root[data-theme="dark"] .lx-theme .icon-sun { display: none; }
  :root[data-theme="dark"] .lx-theme .icon-moon { display: inline; }
  h1 { font: 400 32px/1.1 var(--serif); margin: 0; }
  .lx-take { color: var(--muted); margin: 0; max-width: 75ch; }
  .lx-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .lx-tab { font: inherit; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; margin-bottom: -1px; text-decoration: none; }
  .lx-tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .lx-panel { display: flex; flex-direction: column; gap: 24px; }
  .lx-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .lx-card h2 { margin: 0; font-size: 17px; font-weight: 500; }
  .lx-note { margin: 0; color: var(--muted); font-size: 12px; max-width: 80ch; }
  .lx-legend, .lx-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); }
  .lx-legend span { display: inline-flex; gap: 6px; align-items: center; }
  .lx-swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .lx-swatch.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; height: 2px; }
  .lx-swatch.dot { background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 5px) !important; height: 2px; }
  .lx-controls input, .lx-controls select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0; }
  .lx-count { margin-left: auto; font-variant-numeric: tabular-nums; }
  .lx-scroll { overflow: auto; max-height: 34rem; border-top: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); padding: 0; white-space: nowrap; z-index: 1; }
  th button { font: inherit; color: inherit; background: none; border: 0; padding: 8px; cursor: pointer; width: 100%; text-align: inherit; }
  th.lx-num button, td.lx-num { text-align: right; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.lx-num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.lx-name { font-family: var(--mono); white-space: nowrap; }
  td.lx-why { color: var(--muted); min-width: 14rem; }
  .lx-dev { text-align: center; }
  .lx-chip { display: inline-block; padding: 1px 8px; border-radius: 999px; line-height: 1.5; border: 1px solid currentColor; white-space: nowrap; font-style: normal; text-decoration: none; }
  .lx-chip[data-v="runs"] { color: var(--ok); }
  .lx-chip[data-v="partial"] { color: var(--warn); }
  .lx-chip[data-v="missing"], .lx-chip[data-v="wrong"] { color: var(--bad); }
  a.lx-op { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
  @property --done { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
  .lx-chip.lx-progress { color: transparent; border-color: transparent; transition: --done .8s ease-out;
                          background-image: linear-gradient(90deg, var(--ok) var(--done), var(--bad) var(--done)), linear-gradient(var(--panel), var(--panel)),
                                            linear-gradient(90deg, var(--ok) var(--done), var(--bad) var(--done));
                          background-origin: border-box; -webkit-background-clip: text, padding-box, border-box; background-clip: text, padding-box, border-box; }
  .lx-bad { color: var(--bad); }
  .lx-chart { position: relative; width: 100%; min-height: 280px; }
  .lx-chart svg { display: block; width: 100%; overflow: visible; }
  .lx-chart text { fill: var(--muted); font: 11px var(--sans); }
  .lx-tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: 4px 8px; font-size: 12px; white-space: nowrap; z-index: 2; }
  .lx-tip[hidden] { display: none; }
  .lx-tip-title { font-weight: 600; margin-bottom: 4px; }
  .lx-tip table { width: auto; border-collapse: collapse; font-size: 12px; }
  .lx-tip th { position: static; background: none; border: 0; padding: 1px 12px 1px 0; color: var(--muted); font-weight: 400; }
  .lx-tip td { border: 0; padding: 1px 0; text-align: right; font-variant-numeric: tabular-nums; }
  .lx-back { font-size: 13px; text-decoration: none; }
  .lx-op-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; }
  .lx-op-title h2 { font: 400 28px/1.1 var(--mono); margin: 0; }
  .lx-op-title span { color: var(--muted); font-size: 16px; }
  .lx-chart-title { margin: 12px 0 0; font-size: 13px; font-weight: 500; font-family: var(--mono); color: var(--muted); }
  .lx-subtabs .lx-tab { font-size: 12px; padding: 6px 10px; }
  .lx-device { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; color: var(--muted); font-size: 13px; }
  .lx-run { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
  .lx-run button { font: inherit; font-size: 13px; color: var(--bg); background: var(--fg); border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  .lx-run button:disabled { opacity: .5; cursor: progress; }
  .lx-run-status { max-width: 70ch; }
  .lx-global { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); order: 2; }
  .lx-global[hidden] { display: none; }
  .lx-global-bar { flex: 1; height: 8px; border-radius: 4px; overflow: hidden; background: color-mix(in srgb, var(--bad) 30%, transparent); }
  .lx-global-bar span { display: block; height: 100%; width: 0; background: var(--ok); transition: width .8s ease-out; }
  .lx-global-text { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lx-run select { font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .hl-key { color: var(--hl-key); } .hl-type { color: var(--hl-type); } .hl-num { color: var(--hl-num); }
  .hl-com { color: var(--hl-com); font-style: italic; } .hl-attr { color: var(--hl-attr); }
  pre { margin: 0; padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow: auto; font: 12px/1.5 var(--mono); max-height: 26rem; }
  @media (max-width: 40rem) { .lx-wide { display: none; } }
</style>
</head>
<body>
<div class="lx">
  <header class="lx-head">
    <div class="lx-global" id="lx-global" hidden>
      <div class="lx-global-bar"><span id="lx-global-fill"></span></div>
      <span class="lx-global-text" id="lx-global-text"></span>
    </div>
    <div class="lx-title"><h1>Lumen</h1><button class="lx-theme" id="lx-theme" type="button" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"></path>
      </svg>
    </button></div>
    <p class="lx-take" id="lx-take"></p>
  </header>
  <nav class="lx-tabs" role="tablist" id="lx-tabs">
    <a class="lx-tab" role="tab" id="tab-support" href="#support">Ops</a>
    <a class="lx-tab" role="tab" id="tab-fusion" href="#fusion">Compiler Fusion</a>
  </nav>

  <section id="support" role="tabpanel" class="lx-panel">
    <div class="lx-run">
      <select id="all-mode" aria-label="What to benchmark">
        <option value="mps all">MPS (all ops)</option>
        <option value="mps missing">MPS (missing ops)</option>
      </select>
      <button id="all-run" type="button">Run benchmarks</button>
      <span id="all-status" class="lx-run-status" role="status"></span>
    </div>
    <div class="lx-card">
      <div class="lx-legend">
        <span><i class="lx-chip" data-v="runs">runs</i> runs and matches CPU</span>
        <span><i class="lx-chip" data-v="partial">partial</i> some shapes only</span>
        <span><i class="lx-chip" data-v="missing">missing</i> no kernel</span>
      </div>
      <div class="lx-controls">
        <input type="search" id="prim-search" placeholder="Search primitives" aria-label="Search primitives">
        <select id="prim-kind" aria-label="Kind"><option value="">All kinds</option></select>
        <select id="prim-gaps" aria-label="Gaps on">
          <option value="">Every row</option>
          <option value="mps">Missing on MPS</option>
          <option value="tpu">Missing on TPU</option>
          <option value="either">Missing on MPS or TPU</option>
        </select>
        <span class="lx-count" id="prim-count"></span>
      </div>
      <div class="lx-scroll"><table id="prim-table"><thead><tr></tr></thead><tbody></tbody></table></div>
    </div>
  </section>


  <section id="fusion" role="tabpanel" class="lx-panel" hidden>
    <div class="lx-card">
      <div class="lx-scroll"><table id="fusion-table"><thead><tr></tr></thead><tbody></tbody></table></div>
    </div>
  </section>

  <section id="op" class="lx-panel" hidden>
    <a class="lx-back" href="#support">‹ Ops</a>
    <div class="lx-op-title"><h2 id="op-name"></h2><span id="op-formula"></span></div>
    <nav class="lx-tabs" role="tablist" id="op-devices"></nav>
    <nav class="lx-tabs lx-subtabs" role="tablist" id="op-gpus" hidden></nav>
    <div class="lx-device" id="op-device"></div>
    <p class="lx-note" id="op-none" hidden></p>
    <div id="op-bench" class="lx-panel">
    <div class="lx-run">
      <button id="op-run" type="button">Run benchmark</button>
      <span id="op-measured"></span>
      <span id="op-status" class="lx-run-status" role="status"></span>
    </div>
    <div class="lx-card">
      <h2 id="op-bw-title">Bandwidth</h2>
      <div class="lx-legend" id="op-bw-legend"></div>
      <div id="op-bw"></div>
    </div>
    <div class="lx-card">
      <h2>Codegen</h2>
      <div class="lx-tabs" role="tablist" id="code-tabs">
        <button class="lx-tab" role="tab" type="button" aria-selected="true" aria-controls="op-kernel" id="code-tab-kernel">Code</button>
        <button class="lx-tab" role="tab" type="button" aria-selected="false" aria-controls="op-graph" id="code-tab-graph">Graph</button>
        <button class="lx-tab" role="tab" type="button" aria-selected="false" aria-controls="op-plan" id="code-tab-plan">Plan</button>
      </div>
      <pre id="op-kernel" role="tabpanel" aria-labelledby="code-tab-kernel"></pre>
      <pre id="op-graph" role="tabpanel" aria-labelledby="code-tab-graph" hidden></pre>
      <pre id="op-plan" role="tabpanel" aria-labelledby="code-tab-plan" hidden></pre>
    </div>
    <div class="lx-card">
      <h2>Measurements</h2>
      <div class="lx-scroll"><table id="op-table"><thead><tr></tr></thead><tbody></tbody></table></div>
    </div>
    </div>
  </section>
</div>
<div class="lx-tip" id="lx-tip" hidden></div>
<script>
const METAL_KEYWORDS = new Set(["kernel", "device", "constant", "threadgroup", "thread", "const", "for", "if", "else", "return",
  "while", "break", "continue", "using", "namespace", "template", "typename", "struct", "inline", "static", "constexpr", "auto"]);
const METAL_TYPE = /^(?:void|bool|u?char|u?short|u?int|u?long|half|bfloat|float|size_t|vec|array)\d?$/;
const TOKENS = /(\/\/[^\n]*)|(\[\[[^\]]*\]\])|(^[ \t]*#[^\n]*)|(\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[uUfFlL]*\b)|(\b[A-Za-z_]\w*\b)/gm;
function graphAndKernel(source) {
  const lines = source.split("\n");
  const body = lines.findIndex((line) => line.trim() && !line.startsWith("//"));
  const head = lines.slice(0, body < 0 ? lines.length : body);
  const graph = head.filter((line) => line.startsWith("//")).map((line) => line.replace(/^\/\/ ?/, "")).join("\n");
  return [graph, lines.slice(head.length).join("\n")];
}

function highlighted(source) {
  const out = [];
  let at = 0;
  for (const m of source.matchAll(TOKENS)) {
    const [text, comment, attribute, directive, number, word] = m;
    const kind = comment || directive ? "hl-com" : attribute ? "hl-attr" : number ? "hl-num"
      : word && METAL_KEYWORDS.has(word) ? "hl-key" : word && METAL_TYPE.test(word) ? "hl-type" : null;
    if (!kind) continue;
    if (m.index > at) out.push(source.slice(at, m.index));
    const span = document.createElement("span");
    span.className = kind;
    span.textContent = text;
    out.push(span);
    at = m.index + text.length;
  }
  out.push(source.slice(at));
  return out;
}

for (const tab of document.querySelectorAll("#code-tabs .lx-tab")) {
  tab.addEventListener("click", () => {
    for (const other of document.querySelectorAll("#code-tabs .lx-tab")) {
      const selected = other === tab;
      other.setAttribute("aria-selected", String(selected));
      document.getElementById(other.getAttribute("aria-controls")).hidden = !selected;
    }
  });
}

const themeButton = document.getElementById("lx-theme");
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("lx-theme", theme); } catch {}
}
let savedTheme = null;
try { savedTheme = localStorage.getItem("lx-theme"); } catch {}
setTheme(savedTheme === "dark" ? "dark" : "light");
themeButton.addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
(async () => {
const load = (name) => fetch(`data/${name}.json`, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(`data/${name}.json: ${r.status}`); return r.json(); });
const loaded = (path) => fetch(path, { cache: "no-store" }).then((r) => r.ok ? r.json() : null);
async function loadPerf(dir) {
  const meta = await loaded(`data/${dir}/meta.json`);
  if (!meta) return null;
  const ops = await Promise.all(Object.keys(meta.ops || {}).map((op) => loaded(`data/${dir}/${op}.json`).then((d) => [op, d])));
  const perf = { ...meta, rows: [], code: {}, measured_at: {} };
  for (const [op, d] of ops) {
    if (!d) continue;
    perf.rows.push(...d.rows);
    if (d.code) perf.code[op] = d.code;
    if (d.measured_at) perf.measured_at[op] = d.measured_at;
  }
  return perf;
}
let PRIMITIVES, FUSIONS, PERF;
try {
  [PRIMITIVES, FUSIONS, PERF] = await Promise.all([load("primitives"), load("fusions"), loadPerf("elementwise_mps")]);
  PRIMITIVES.sort((a, b) => a.primitive.localeCompare(b.primitive));
  if (!PERF) throw new Error("data/elementwise_mps/meta.json: not found");
} catch (e) {
  const take = document.getElementById("lx-take");
  take.textContent = `Could not load the data files (${e.message}). Serve this folder, for example with python3 -m http.server in dashboard/, then open http://localhost:8000.`;
  take.style.color = "var(--bad)";
  return;
}
const DEVICES = [["cpu", "CPU"], ["mps", "MPS"], ["tpu", "TPU"], ["cuda", "CUDA"], ["triton", "Triton"]];
const GPUS = [["a100", "A100"], ["h100", "H100"], ["h200", "H200"], ["b200", "B200"], ["b300", "B300"], ["r200", "R200"]];
const PERFS = {};
const ORDER = { runs: 0, partial: 1, wrong: 2, missing: 3 };
let DEVICE_BW, BENCHED, OK_ROWS, SIZE_TICKS, measuring = null;
const KNOWN = {};
const SEEN_SIZES = new Set();
function derive() {
  OK_ROWS = PERF.rows.filter((r) => !r.error);
  for (const [op, o] of Object.entries(PERF.ops || {})) KNOWN[op] = o;
  for (const r of PERF.rows) if (r.formula) KNOWN[r.op] = { formula: r.formula, kind: r.kind };
  DEVICE_BW = PERF.spec_memory_gbs;
  BENCHED = [...new Set([...PERF.rows.map((r) => r.op), ...Object.keys(PERF.measured_at || {}), ...(measuring ? [measuring] : [])])];
  SIZE_TICKS = [...new Set(OK_ROWS.map((r) => r.n))].sort((a, b) => a - b);
  for (const n of SIZE_TICKS) SEEN_SIZES.add(n);
}
derive();

const fmt = {
  int: (n) => n.toLocaleString("en"),
  n: (n) => n >= 1 << 20 ? `${n / (1 << 20)}M` : n >= 1024 ? `${n / 1024}K` : String(n),
  gbs: (v) => `${v >= 100 ? v.toFixed(0) : v.toFixed(1)} GB/s`,
  tflops: (v) => `${v >= 10 ? v.toFixed(1) : v.toFixed(2)} TFLOP/s`,
  us: (v) => v >= 1000 ? `${(v / 1000).toFixed(2)} ms` : `${v >= 10 ? v.toFixed(0) : v.toFixed(1)} µs`,
  pct: (v) => `${(100 * v).toFixed(0)}%`,
  num: (v) => v >= 1000 ? `${(v / 1000).toFixed(v >= 10000 ? 0 : 1)}K` : v >= 1 ? v.toFixed(0) : v.toPrecision(1),
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const rowOf = (op, dtype, n) => OK_ROWS.find((r) => r.op === op && r.dtype === dtype && r.n === n);
const ITEM = { float32: 4, bfloat16: 2, bool: 1 };
function detail(r, who, us, timing) {
  const loaded = r.loaded_bytes ?? r.n * r.inputs * ITEM[r.dtype];
  const stored = r.stored_bytes ?? r.n * ITEM[r.out_dtype];
  const gbs = (loaded + stored) / us / 1e3;
  const rows = [
    ["Bytes loaded", fmt.int(loaded)],
    ["Bytes stored", fmt.int(stored)],
    ["BW", fmt.gbs(gbs)],
    ["BW %", `${fmt.pct(gbs / DEVICE_BW)} of ${DEVICE_BW} GB/s`],
  ];
  if (r.compute_bound) rows.push(["FLOPs", fmt.int(r.flops)], ["FLOP/s", fmt.tflops(r.flops / us / 1e6)]);
  rows.push([`Time (${timing})`, fmt.us(us)]);
  return { title: `${who} · ${r.op} · ${r.dtype} · ${fmt.int(r.n)} elements`, rows };
}
const maybe = (v, f) => v == null || Number.isNaN(v) ? "—" : f(v);

const PROGRESS = {};
function progressed(c, op) {
  if (PROGRESS[op] == null) return c;
  c.classList.add("lx-progress");
  c.classList.toggle("lx-pending", PROGRESS[op] < 1);
  c.style.setProperty("--done", `${(100 * PROGRESS[op]).toFixed(1)}%`);
  c.title = PROGRESS[op] < 1 ? `benchmarking: ${(100 * PROGRESS[op]).toFixed(0)}%` : "benchmarked";
  return c;
}

function advance(op, done) {
  PROGRESS[op] = done;
  for (const c of document.querySelectorAll(`#prim-table .lx-chip[data-device="mps"][data-op="${CSS.escape(op)}"]`)) progressed(c, op);
}

function opChip(r, device) {
  const c = chip(r[device]);
  c.dataset.device = device;
  c.dataset.op = r.primitive;
  return device === "mps" ? progressed(c, r.primitive) : c;
}

function opLink(op) {
  const a = el("a", "lx-op", op);
  a.href = `#op-${op}`;
  return a;
}

function chip(value, href) {
  const c = el(href ? "a" : "span", "lx-chip", value);
  c.dataset.v = value;
  if (href) c.href = href;
  return c;
}

function table(id, columns, rows, sort) {
  const t = document.getElementById(id);
  const head = t.querySelector("thead tr");
  if (!head.children.length) {
    for (const col of columns) {
      const th = el("th");
      if (col.kind === "dev") th.className = "lx-dev";
      if (col.kind === "num") th.className = "lx-num";
      if (col.wide) th.classList.add("lx-wide");
      const b = el("button", null, col.label);
      b.addEventListener("click", () => { sort.dir = sort.key === col.key ? -sort.dir : 1; sort.key = col.key; sort.draw(); });
      th.dataset.key = col.key;
      th.append(b);
      head.append(th);
    }
  }
  const shown = rows.slice();
  if (sort.key) {
    const col = columns.find((c) => c.key === sort.key);
    const v = (r) => col.sort ? col.sort(r) : r[col.key];
    shown.sort((a, b) => {
      const x = v(a) ?? "", y = v(b) ?? "";
      const c = typeof x === "number" && typeof y === "number" ? x - y : x in ORDER && y in ORDER ? ORDER[x] - ORDER[y] : String(x).localeCompare(String(y));
      return c * sort.dir;
    });
  }
  const body = t.querySelector("tbody");
  body.replaceChildren();
  for (const r of shown) {
    const tr = el("tr");
    for (const col of columns) {
      const td = el("td");
      if (col.kind === "dev") td.className = "lx-dev";
      if (col.kind === "num") td.className = "lx-num";
      if (col.kind === "name") td.className = "lx-name";
      if (col.kind === "why") td.className = "lx-why";
      if (col.wide) td.classList.add("lx-wide");
      const v = col.render ? col.render(r) : r[col.key] ?? "";
      if (v instanceof Node) td.append(v); else td.textContent = v;
      tr.append(td);
    }
    body.append(tr);
  }
  head.querySelectorAll("th").forEach((th) => th.setAttribute("aria-sort", sort.key === th.dataset.key ? (sort.dir > 0 ? "ascending" : "descending") : "none"));
  return shown.length;
}

const tip = document.getElementById("lx-tip");
function showTip(evt, info) {
  const t = el("table");
  for (const [k, v] of info.rows) {
    const tr = el("tr");
    tr.append(el("th", null, k), el("td", null, v));
    t.append(tr);
  }
  tip.replaceChildren(el("div", "lx-tip-title", info.title), t);
  tip.hidden = false;
  const pad = 12, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.pageX + pad, y = evt.pageY + pad;
  if (x + w > document.documentElement.clientWidth - 8) x = evt.pageX - w - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
const hideTip = () => { tip.hidden = true; };

const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const logScale = ([lo, hi], [a, b]) => (v) => a + (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)) * (b - a);
const linearScale = ([lo, hi], [a, b]) => (v) => a + (v - lo) / (hi - lo) * (b - a);
function throughputAxis(values, label) {
  const max = Math.max(...values, 1e-9);
  const unit = [1, 2, 5, 10].map((m) => m * 10 ** Math.floor(Math.log10(max / 4))).find((u) => max / u <= 6);
  const top = Math.ceil(max * 1.05 / unit) * unit;
  const ticks = [];
  for (let t = 0; t <= top + unit / 2; t += unit) ticks.push(+t.toPrecision(6));
  return { domain: [0, top], ticks, fmt: (v) => String(v), label, linear: true };
}

function bandwidthAxis(values) {
  const top = Math.ceil(Math.max(DEVICE_BW, ...values) * 1.05 / 50) * 50;
  const ticks = [];
  for (let t = 0; t <= top; t += 50) ticks.push(t);
  return { domain: [0, top], ticks, fmt: (v) => String(v), label: "GB/s", linear: true };
}

function chart(id, spec) {
  const box = document.getElementById(id);
  box.replaceChildren();
  const W = Math.max(280, box.clientWidth), H = 280;
  const m = { l: 56, r: 16, t: 12, b: 40 };
  const sx = logScale(spec.x.domain, [m.l, W - m.r]);
  const sy = (spec.y.linear ? linearScale : logScale)(spec.y.domain, [H - m.b, m.t]);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": spec.label });
  for (const t of spec.x.ticks) {
    svg.append(svgEl("line", { x1: sx(t), x2: sx(t), y1: m.t, y2: H - m.b, stroke: "var(--grid)" }));
    const tx = svgEl("text", { x: sx(t), y: H - m.b + 16, "text-anchor": "middle" });
    tx.textContent = spec.x.fmt(t);
    svg.append(tx);
  }
  for (const t of spec.y.ticks) {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: sy(t), y2: sy(t), stroke: "var(--grid)" }));
    const ty = svgEl("text", { x: m.l - 6, y: sy(t) + 4, "text-anchor": "end" });
    ty.textContent = spec.y.fmt(t);
    svg.append(ty);
  }
  const xl = svgEl("text", { x: (m.l + W - m.r) / 2, y: H - 6, "text-anchor": "middle" });
  xl.textContent = spec.x.label;
  const yl = svgEl("text", { x: 12, y: (m.t + H - m.b) / 2, "text-anchor": "middle", transform: `rotate(-90 12 ${(m.t + H - m.b) / 2})` });
  yl.textContent = spec.y.label;
  svg.append(xl, yl);
  const clip = (v, [lo, hi]) => Math.min(hi, Math.max(lo, v));
  for (const line of spec.lines || []) {
    const pts = line.points.map(([x, y]) => `${sx(x)},${sy(clip(y, spec.y.domain))}`).join(" ");
    svg.append(svgEl("polyline", { points: pts, fill: "none", stroke: line.color, "stroke-width": line.width || 2,
      "stroke-dasharray": line.dot ? "0.1 5" : line.dash ? "5 4" : "none", "stroke-linecap": "round", "stroke-linejoin": "round", opacity: line.opacity ?? 1 }));
    if (line.label) {
      const [x, y] = line.labelAt;
      const t = svgEl("text", { x: sx(x), y: sy(y) - 6, "text-anchor": line.anchor || "end" });
      t.textContent = line.label;
      t.style.fill = line.color;
      svg.append(t);
    }
  }
  for (const p of spec.points || []) {
    const cx = sx(p.x), cy = sy(clip(p.y, spec.y.domain));
    const c = svgEl("circle", { cx, cy, r: p.r || 4, fill: p.hollow ? "var(--panel)" : p.color, stroke: p.hollow ? p.color : "var(--panel)",
      "stroke-width": p.hollow ? 1.5 : 1, opacity: p.opacity ?? 1, "pointer-events": "none" });
    const hit = svgEl("circle", { cx, cy, r: 9, fill: "transparent" });
    hit.addEventListener("mousemove", (e) => { showTip(e, p.tip); c.setAttribute("r", (p.r || 4) + 2); });
    hit.addEventListener("mouseleave", () => { hideTip(); c.setAttribute("r", p.r || 4); });
    if (p.href) { hit.style.cursor = "pointer"; hit.addEventListener("click", () => { location.hash = p.href; }); }
    svg.append(c, hit);
  }
  box.append(svg);
}

function legend(id, items) {
  const box = document.getElementById(id);
  box.replaceChildren();
  for (const [label, color, style] of items) {
    const s = el("span");
    const w = el("i", "lx-swatch" + (style === "dot" ? " dot" : style ? " dash" : ""));
    w.style.background = color;
    w.style.color = color;
    s.append(w, label);
    box.append(s);
  }
}

const runButton = document.getElementById("op-run");
const runStatus = document.getElementById("op-status");
const allButton = document.getElementById("all-run");
const allStatus = document.getElementById("all-status");
const allMode = document.getElementById("all-mode");

async function runBenchmark(op, device, measured) {
  const url = new URL(`api/benchmark/${encodeURIComponent(op)}?device=${encodeURIComponent(device)}`, location.href);
  const r = await fetch(url, { method: "POST" }).catch((e) => {
    throw new Error(`Could not reach the benchmark server at ${url.origin} (${e.message}): is python dashboard/serve.py running?`);
  });
  if (!r.headers.get("Content-Type")?.includes("json")) {
    throw new Error("This page is served without the benchmark server. Start it with python dashboard/serve.py, then open http://127.0.0.1:8000.");
  }
  if (!r.ok) throw new Error((await r.json()).error || `The server answered ${r.status}.`);
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buffered = "", final = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffered += decoder.decode(value, { stream: true });
    let at;
    while ((at = buffered.indexOf("\n")) >= 0) {
      const line = buffered.slice(0, at).trim();
      buffered = buffered.slice(at + 1);
      if (!line) continue;
      const message = JSON.parse(line);
      if (message.error) throw new Error(message.error);
      if (message.data) final = message.data;
      if (message.row) measured(message.row);
    }
  }
  if (!final) throw new Error("The benchmark stopped before it finished; the saved data is unchanged.");
  return final;
}

const expectedRows = (op) => (KNOWN[op]?.dtypes?.length || 2) * (KNOWN[op]?.sizes?.length || PERF.sizes?.length || SEEN_SIZES.size);

function measuringOp(op) {
  measuring = op;
  advance(op, 0);
  PERF = { ...PERF, rows: PERF.rows.filter((r) => r.op !== op) };
  derive();
  draw();
}

const globalBar = document.getElementById("lx-global");
function overall(done, text) {
  globalBar.hidden = false;
  document.getElementById("lx-global-fill").style.width = `${(100 * Math.min(done, 1)).toFixed(1)}%`;
  document.getElementById("lx-global-text").textContent = text;
}

let benchmarking = false;
function busy(running) {
  benchmarking = running;
  runButton.disabled = allButton.disabled = running;
  if (!running && current.op) runButton.disabled = !KNOWN[current.op] || current.device !== "mps";
}

runButton.addEventListener("click", async () => {
  const op = current.op;
  const started = performance.now();
  const previous = PERF;
  const expected = expectedRows(op);
  let got = 0;
  busy(true);
  runStatus.className = "lx-run-status";
  runStatus.textContent = `Running ${op} on this machine's GPU: ${expected} measurements, about a minute.`;
  overall(0, `${op}: starting`);
  measuringOp(op);
  try {
    PERF = await runBenchmark(op, "mps", (row) => {
      got += 1;
      advance(op, Math.min(got / expected, 1));
      overall(got / expected, `${op}: ${got} of ${expected} measured`);
      PERF.rows.push(row);
      runStatus.textContent = `Measured ${got} of ${expected}: ${row.dtype} at ${fmt.n(row.n)} elements.`;
      derive();
      draw();
    });
    advance(op, 1);
    runStatus.textContent = `Done in ${((performance.now() - started) / 1000).toFixed(0)} s; the charts and tables show the new run.`;
  } catch (e) {
    PERF = previous;
    delete PROGRESS[op];
    runStatus.textContent = e.message;
    runStatus.classList.add("lx-bad");
  } finally {
    measuring = null;
    globalBar.hidden = true;
    busy(false);
    derive();
    draw();
  }
});

allButton.addEventListener("click", async () => {
  const [device, which] = allMode.value.split(" ");
  const measured = (op) => PERF.rows.some((r) => r.op === op);
  const ops = Object.keys(KNOWN).filter((op) => which === "all" || !measured(op));
  if (!ops.length) {
    allStatus.className = "lx-run-status";
    allStatus.textContent = "Every op is measured already; choose MPS (all ops) to measure them again.";
    return;
  }
  const started = performance.now();
  const failed = [];
  const before = PERF;
  const pending = new Set(ops);
  const hidePending = () => { PERF = { ...PERF, rows: PERF.rows.filter((r) => !pending.has(r.op)) }; };
  busy(true);
  allStatus.className = "lx-run-status";
  for (const op of ops) PROGRESS[op] = 0;
  hidePending();
  derive();
  draw();
  for (const [k, op] of ops.entries()) {
    const expected = expectedRows(op);
    let got = 0;
    allStatus.textContent = `Running ${op} (${k + 1} of ${ops.length}) on ${device.toUpperCase()}…`;
    overall(k / ops.length, `${k} of ${ops.length} ops · running ${op}`);
    measuringOp(op);
    try {
      PERF = await runBenchmark(op, device, (row) => {
        got += 1;
        advance(op, Math.min(got / expected, 1));
        overall((k + Math.min(got / expected, 1)) / ops.length, `${k} of ${ops.length} ops · running ${op}`);
        PERF.rows.push(row);
        allStatus.textContent = `Running ${op} (${k + 1} of ${ops.length}) on ${device.toUpperCase()}: ${got} of ${expected} measured.`;
        derive();
        if (current.view !== "support") draw();
      });
      advance(op, 1);
      pending.delete(op);
      hidePending();
    } catch (e) {
      pending.delete(op);
      PERF = { ...PERF, rows: [...PERF.rows.filter((r) => r.op !== op), ...before.rows.filter((r) => r.op === op)] };
      delete PROGRESS[op];
      failed.push(`${op} (${e.message})`);
    }
    measuring = null;
    derive();
    draw();
  }
  globalBar.hidden = true;
  busy(false);
  const took = `${((performance.now() - started) / 60000).toFixed(1)} min`;
  allStatus.textContent = failed.length
    ? `Ran ${ops.length - failed.length} of ${ops.length} ops in ${took}; failed: ${failed.join("; ")}`
    : `Ran ${ops.length} ops in ${took}; their pages show the new numbers.`;
  if (failed.length) allStatus.classList.add("lx-bad");
});

function deviceTab(href, label, selected) {
  const a = el("a", "lx-tab", label);
  a.href = href;
  a.setAttribute("role", "tab");
  a.setAttribute("aria-selected", String(selected));
  return a;
}

function drawOp(op) {
  const { device, gpu } = current;
  const known = KNOWN[op] || {};
  document.getElementById("op-name").textContent = op;
  document.getElementById("op-formula").textContent = known.formula ? `${known.formula} · ${known.kind}` : "";
  document.getElementById("op-devices").replaceChildren(...DEVICES.map(([k, label]) =>
    deviceTab(k === "triton" ? `#op-${op}/triton/${gpu}` : `#op-${op}/${k}`, label, k === device)));
  const gpus = document.getElementById("op-gpus");
  gpus.hidden = device !== "triton";
  gpus.replaceChildren(...GPUS.map(([k, label]) => deviceTab(`#op-${op}/triton/${k}`, label, k === gpu)));
  const row = PRIMITIVES.find((r) => r.primitive === op);
  const status = row?.[device];
  const facts = [row?.[`${device}_kernel`], row?.[`${device}_note`]].filter(Boolean).map((t) => el("span", null, t));
  document.getElementById("op-device").replaceChildren(...(status ? [chip(status)] : []), ...facts);
  const source = device === "triton" ? `triton/${gpu}` : device;
  const perf = device === "mps" ? PERF : PERFS[source];
  const where = device === "triton" ? `Triton · ${GPUS.find(([k]) => k === gpu)[1]}` : DEVICES.find(([k]) => k === device)[1];
  const none = document.getElementById("op-none");
  none.hidden = !!perf;
  none.textContent = device === "triton" && !(source in PERFS) ? "Loading…" : `Not benchmarked on ${where} yet.`;
  document.getElementById("op-bench").hidden = !perf;
  if (!perf) return;
  if (perf === PERF) return drawBench(op, true);
  const saved = [PERF, OK_ROWS, DEVICE_BW, SIZE_TICKS];
  PERF = perf;
  OK_ROWS = perf.rows.filter((r) => !r.error);
  DEVICE_BW = perf.spec_memory_gbs;
  SIZE_TICKS = [...new Set(OK_ROWS.map((r) => r.n))].sort((a, b) => a - b);
  try {
    drawBench(op, false);
  } finally {
    [PERF, OK_ROWS, DEVICE_BW, SIZE_TICKS] = saved;
  }
}

function drawBench(op, runnable) {
  const at = PERF.measured_at?.[op];
  document.getElementById("op-measured").textContent = at
    ? `Measured ${new Date(at).toLocaleString()} on ${PERF.device}.`
    : PERF.rows.some((r) => r.op === op)
      ? `Measured on ${PERF.device}, in the first snapshot.`
      : runnable && KNOWN[op]
        ? "Not measured yet: Run benchmark measures it on this machine."
        : "No benchmark for this op yet.";
  if (!benchmarking) runButton.disabled = !runnable || !KNOWN[op];
  runButton.hidden = !runnable;
  if (!runButton.disabled && runStatus.dataset.op !== op) { runStatus.textContent = ""; runStatus.className = "lx-run-status"; }
  runStatus.dataset.op = op;
  const dtypes = [...new Set(OK_ROWS.filter((r) => r.op === op).map((r) => r.dtype))].map((dtype) => [dtype]);
  const compute = OK_ROWS.some((r) => r.op === op && r.compute_bound);
  const value = (r, us) => compute ? r.flops / us / 1e6 : r.bytes / us / 1e3;
  document.getElementById("op-bw-title").textContent = compute ? "Throughput" : "Bandwidth";
  const IMPLS = [[(r) => r.lumen_us, "lumen", "var(--s1)"], [(r) => r.torch_us, "PyTorch", "var(--s2)"]];
  const bandwidthChart = (id, dtype) => {
    const lines = [], points = [];
    for (const [us, who, color] of IMPLS) {
      const rs = OK_ROWS.filter((r) => r.op === op && r.dtype === dtype && us(r) != null);
      if (!rs.length) continue;
      lines.push({ points: rs.map((r) => [r.n, value(r, us(r))]), color, width: 2 });
      for (const r of rs) points.push({ x: r.n, y: value(r, us(r)), r: 3, color, tip: detail(r, who, us(r), "per call") });
    }
    if (!compute) lines.push({ points: [[SIZE_TICKS[0], DEVICE_BW], [SIZE_TICKS.at(-1), DEVICE_BW]], color: "var(--roof)", width: 1.5, dash: true, label: `${DEVICE_BW} GB/s device`, labelAt: [SIZE_TICKS[0], DEVICE_BW], anchor: "start" });
    const values = points.map((p) => p.y);
    chart(id, { label: `${op} ${dtype} ${compute ? "throughput" : "bandwidth"}`, x: { domain: [SIZE_TICKS[0], SIZE_TICKS.at(-1)], ticks: SIZE_TICKS, fmt: fmt.n, label: "elements" },
      y: compute ? throughputAxis(values, "TFLOP/s") : bandwidthAxis(values), lines, points });
  };
  const charts = dtypes.map(([dtype]) => [dtype, el("div", "lx-chart")]);
  document.getElementById("op-bw").replaceChildren(...charts.flatMap(([dtype, box]) => {
    box.id = `op-bw-${dtype}`;
    return [el("h3", "lx-chart-title", dtype), box];
  }));
  for (const [dtype, box] of charts) bandwidthChart(box.id, dtype);
  legend("op-bw-legend", [...IMPLS.map(([, who, color]) => [who, color]), ...(compute ? [] : [["device bandwidth", "var(--roof)", true]])]);

  const code = PERF.code[op];
  const [graph, kernel] = code ? graphAndKernel(code.kernel) : ["", "Not captured for this op."];
  document.getElementById("op-graph").textContent = graph;
  document.getElementById("op-kernel").replaceChildren(...highlighted(kernel));
  document.getElementById("op-plan").textContent = code ? code.plan : "";
  const rows = PERF.rows.filter((r) => r.op === op);
  table("op-table", [
    { key: "dtype", label: "dtype" }, { key: "n", label: "Elements", kind: "num", render: (r) => fmt.int(r.n) },
    { key: "gbs", label: "Throughput", kind: "num", sort: (r) => r.compute_bound ? r.flops / r.lumen_us : r.gbs,
      render: (r) => r.error ? "" : r.compute_bound ? fmt.tflops(r.flops / r.lumen_us / 1e6) : fmt.gbs(r.gbs) },
    { key: "speedup", label: "Speedup over PyTorch", kind: "num", sort: speedup,
      render: (r) => r.error ? "" : maybe(speedup(r), (v) => `${v.toFixed(2)}×`) },
  ], rows, opSort);
}
const speedup = (r) => r.torch_us && r.lumen_us ? r.torch_us / r.lumen_us : null;
const opSort = { key: null, dir: 1, draw: () => drawOp(current.op) };

const current = { view: "support", op: null, device: "mps", gpu: GPUS[0][0] };
function route() {
  const h = location.hash.slice(1);
  const [op, device, gpu] = h.startsWith("op-") ? h.slice(3).split("/") : [null];
  const listed = PRIMITIVES.some((r) => r.primitive === op);
  current.view = op && (listed || KNOWN[op] || BENCHED.includes(op)) ? "op" : h === "fusion" ? "fusion" : "support";
  current.op = current.view === "op" ? op : null;
  current.device = DEVICES.some(([k]) => k === device) ? device : "mps";
  current.gpu = GPUS.some(([k]) => k === gpu) ? gpu : GPUS[0][0];
  const source = `triton/${current.gpu}`;
  if (current.view === "op" && current.device === "triton" && !(source in PERFS)) {
    loadPerf(`elementwise_triton/${current.gpu}`).catch(() => null).then((perf) => {
      PERFS[source] = perf;
      if (current.view === "op") draw();
    });
  }
  for (const id of ["support", "fusion", "op"]) document.getElementById(id).hidden = id !== current.view;
  document.getElementById("tab-support").setAttribute("aria-selected", String(current.view !== "fusion"));
  document.getElementById("tab-fusion").setAttribute("aria-selected", String(current.view === "fusion"));
  draw();
  if (current.view === "op") window.scrollTo(0, 0);
}
function draw() {
  hideTip();
  if (current.view === "support") drawPrimitives();
  if (current.view === "fusion") fusSort.draw();
  if (current.view === "op") drawOp(current.op);
}
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(draw, 150); });
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
